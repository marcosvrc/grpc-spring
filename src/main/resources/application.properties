#Postgres Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
jpa.default.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#gRPC Server Configuration
spring.grpc.server.port=9090

#Autenticação do serviço gRPC (ApiKeyServerInterceptor) - troque em produção!
app.security.api-key=${API_KEY:local-dev-key-change-me}
