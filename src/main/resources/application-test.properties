# H2 Configuration

spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Nenhuma configuração de gRPC é necessária aqui: os testes atuais (ProductServiceImplTest,
# ProductConverterUtilTest) são testes de unidade que não abrem transporte gRPC.
# Para testes de integração que exercitem o serviço via gRPC, use o transporte in-process
# nativo do Spring Boot (@AutoConfigureTestGrpcTransport + @ImportGrpcClients), documentado em
# https://docs.spring.io/spring-boot/reference/io/grpc.html#io.grpc.testing

