# Perfil opcional que habilita TLS no servidor gRPC usando um certificado
# autoassinado de desenvolvimento (gerado por scripts/generate-dev-cert.sh).
# Ativar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=tls
#
# NÃO é o perfil padrão: por padrão a aplicação continua em texto plano,
# adequado para desenvolvimento local isolado. Antes de expor o serviço
# fora do localhost, use este perfil (com um certificado de verdade, não
# o autoassinado) ou equivalente.

spring.ssl.bundle.pem.grpc.keystore.certificate=file:certs/server-cert.pem
spring.ssl.bundle.pem.grpc.keystore.private-key=file:certs/server-key.pem

spring.grpc.server.ssl.enabled=true
spring.grpc.server.ssl.bundle=grpc
