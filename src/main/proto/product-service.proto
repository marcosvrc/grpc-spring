syntax = "proto3";

package br.com.grpc.spring;

option java_package = "br.com.grpc.spring";
option java_multiple_files = true;

service ProductService {
  rpc Create(ProductRequest) returns (ProductResponse);
  rpc FindById(RequestById) returns (ProductResponse);
  rpc Delete(RequestById) returns (EmptyResponse);
  rpc FindAll(FindAllRequest) returns (ProductResponseList);

}

message EmptyResponse {}

message FindAllRequest {
  int32 page = 1;
  int32 size = 2;
}

message ProductResponseList {
  repeated ProductResponse product = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
}

message RequestById {
  int64 id = 1;
}

message ProductRequest {
  string name = 1;
  double price = 2;
  int32 quantity_in_stock = 3;
}

message ProductResponse {
  int64 id =1;
  string name = 2;
  double price = 3;
  int32 quantity_in_stock = 4;
}
